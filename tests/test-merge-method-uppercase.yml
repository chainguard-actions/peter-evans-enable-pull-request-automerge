name: Test uppercase merge method is lowercased
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action has a 'lowercase' step that converts merge-method to lowercase.
      # Providing 'REBASE' (uppercase) should be lowercased to 'rebase' before
      # being passed to 'gh pr merge --rebase'. The action will fail on the
      # sentinel repo, but it should NOT fail on the lowercase step itself.
      - id: action
        uses: .
        continue-on-error: true
        with:
          pull-request-number: 7
          merge-method: REBASE

      - name: Assert action ran (fails gracefully on sentinel repo, not on lowercase step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
